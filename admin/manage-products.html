
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoffyCup Admin | Manage Products</title>

<style>
:root{
    --panel:rgba(14,23,12,.9);
    --line:rgba(185,240,181,.45);
    --text:#eefbe9;
    --muted:#b5c9ae;
    --green:#52652b;
    --red:#ff9288;
    --gold:#e0b45a;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
    background:
        linear-gradient(rgba(5,12,4,.48),rgba(5,12,4,.7)),
        url("../images/login-img.png") center/cover no-repeat fixed,
        #10200e;
}

button,input,select{
    font:inherit;
}

button,select{
    cursor:pointer;
}

.layout{
    display:grid;
    grid-template-columns:230px minmax(0,1fr);
    gap:18px;
    padding:18px;
    min-height:100vh;
    transition:grid-template-columns .25s;
}

.card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    backdrop-filter:blur(12px);
    box-shadow:0 8px 28px #0005;
}

.sidebar{
    min-height:calc(100vh - 36px);
    padding:22px 15px;
    display:flex;
    flex-direction:column;
    gap:10px;
    position:sticky;
    top:18px;
    align-self:start;
}

.logo{
    margin:0 7px 22px;
    color:#e9ffe4;
    font:bold 1.4rem Georgia,serif;
    white-space:nowrap;
}

nav{
    display:flex;
    flex-direction:column;
    gap:8px;
}

nav a,.logout{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 12px;
    border:1px solid transparent;
    border-radius:10px;
    color:var(--muted);
    text-decoration:none;
    font-size:.92rem;
    font-weight:bold;
    white-space:nowrap;
}

nav a:hover{
    background:#b9f0b11a;
    color:white;
}

nav a.active{
    background:var(--green);
    color:white;
}

.nav-icon{
    width:23px;
    flex:0 0 23px;
    text-align:center;
    font-size:1.1rem;
}

.logout{
    margin-top:auto;
    width:100%;
    background:transparent;
    border-color:var(--red);
    color:var(--red);
    text-align:left;
}

.logout:hover{
    background:#ff92881f;
}

main{
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px 20px;
}

.menu-button{
    width:43px;
    height:43px;
    flex:0 0 43px;
    border:1px solid var(--line);
    border-radius:10px;
    color:white;
    background:#b9f0b10f;
    font-size:1.4rem;
}

.header-text{
    flex:1;
    min-width:0;
}

h1{
    font-size:1.55rem;
    margin-bottom:5px;
}

.subtitle{
    color:var(--muted);
    font-size:.88rem;
    line-height:1.5;
}

.btn{
    padding:10px 15px;
    border:1px solid transparent;
    border-radius:9px;
    background:var(--green);
    color:white;
    font-weight:bold;
}

.btn:hover{
    background:#657a32;
}

.btn:disabled{
    opacity:.6;
    cursor:wait;
}

.btn.delete{
    background:transparent;
    border-color:var(--red);
    color:var(--red);
}

.products{
    padding:20px;
    min-width:0;
}

.products-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:17px;
}

.products-heading h2{
    font-size:1.15rem;
}

.product-count{
    color:var(--muted);
    font-size:.85rem;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:590px;
    border-collapse:collapse;
}

th,td{
    padding:13px 10px;
    text-align:left;
    vertical-align:middle;
    border-bottom:1px solid #b9f0b12e;
}

th{
    color:var(--muted);
    font-size:.83rem;
    white-space:nowrap;
    background:#b9f0b10a;
}

td{
    font-size:.88rem;
}

tbody tr:last-child td{
    border-bottom:0;
}

tbody tr:hover{
    background:#b9f0b10a;
}

.product-image{
    display:block;
    width:48px;
    height:48px;
    object-fit:cover;
    border:1px solid var(--line);
    border-radius:10px;
    background:#b9f0b114;
}

.product-image[hidden],
.image-placeholder[hidden]{
    display:none!important;
}

.image-placeholder{
    display:grid;
    place-items:center;
    width:48px;
    height:48px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#b9f0b114;
    font-size:1.4rem;
}

.category{
    color:var(--gold);
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.empty-message,.status-message{
    color:var(--muted);
    text-align:center;
    padding:28px 15px;
}

/* Add/Edit Product Modal */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:40;
    align-items:center;
    justify-content:center;
    padding:15px;
    background:#000b;
}

.modal.show{
    display:flex;
}

.form-box{
    width:100%;
    max-width:440px;
    max-height:calc(100vh - 30px);
    overflow-y:auto;
    padding:24px;
}

.form-box h2{
    margin-bottom:20px;
    font-size:1.3rem;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-size:.9rem;
    font-weight:bold;
}

.field input,.field select,.field textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:9px;
    outline:none;
    background:#182515;
    color:var(--text);
}

.field input:focus,.field select:focus,.field textarea:focus{
    border-color:#e0f7d8;
    box-shadow:0 0 0 2px #b9f0b11a;
}

.field select option{
    background:#182515;
}

.error{
    min-height:19px;
    color:var(--red);
    font-size:.85rem;
    line-height:1.4;
}

.form-buttons{
    display:flex;
    justify-content:flex-end;
    flex-wrap:wrap;
    gap:9px;
    margin-top:16px;
}

.cancel-button{
    background:transparent;
    border-color:var(--line);
    color:var(--text);
}

/* Notification */

.notice{
    position:fixed;
    z-index:60;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    display:none;
    max-width:calc(100% - 30px);
    padding:13px 18px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#253b1d;
    color:white;
    box-shadow:0 8px 25px #0006;
    text-align:center;
    font-size:.9rem;
}

.notice.show{
    display:block;
}

/* Collapsed Desktop Sidebar */

.layout.collapsed{
    grid-template-columns:76px minmax(0,1fr);
}

.layout.collapsed .sidebar{
    padding-left:9px;
    padding-right:9px;
}

.layout.collapsed .logo{
    margin-left:0;
    margin-right:0;
    text-align:center;
}

.layout.collapsed .logo-text,
.layout.collapsed .nav-text,
.layout.collapsed .logout-text{
    display:none;
}

.layout.collapsed nav a,
.layout.collapsed .logout{
    justify-content:center;
    padding-left:8px;
    padding-right:8px;
}

.layout.collapsed .nav-icon{
    flex-basis:auto;
}

.overlay{
    display:none;
}

/* Responsive */

@media(max-width:1000px){
    .layout{
        grid-template-columns:205px minmax(0,1fr);
        gap:12px;
        padding:12px;
    }

    .layout.collapsed{
        grid-template-columns:70px minmax(0,1fr);
    }

    .header{
        flex-wrap:wrap;
        padding:15px;
    }
}

@media(max-width:760px){
    .layout,.layout.collapsed{
        display:block;
        padding:10px;
    }

    .sidebar{
        position:fixed;
        z-index:31;
        top:10px;
        bottom:10px;
        left:10px;
        width:245px;
        min-height:0;
        height:auto;
        overflow-y:auto;
        transform:translateX(-120%);
        transition:transform .25s;
        background:rgba(12,23,10,.98);
    }

    .layout.mobile-open .sidebar{
        transform:translateX(0);
    }

    .layout.collapsed .sidebar{
        padding:22px 15px;
    }

    .layout.collapsed .logo{
        text-align:left;
        margin:0 7px 22px;
    }

    .layout.collapsed .logo-text,
    .layout.collapsed .nav-text,
    .layout.collapsed .logout-text{
        display:inline;
    }

    .layout.collapsed nav a,
    .layout.collapsed .logout{
        justify-content:flex-start;
        padding:13px 12px;
    }

    .layout.collapsed .nav-icon{
        flex-basis:23px;
    }

    .overlay{
        position:fixed;
        inset:0;
        z-index:30;
        background:#000a;
    }

    .layout.mobile-open .overlay{
        display:block;
    }

    main{
        gap:12px;
    }

    .header{
        gap:11px;
        padding:14px;
    }

    h1{
        font-size:1.25rem;
    }

    .subtitle{
        font-size:.82rem;
    }

    .header .btn{
        margin-left:auto;
    }

    .products{
        padding:14px;
    }
}

@media(max-width:420px){
    .header{
        padding:12px;
    }

    h1{
        font-size:1.1rem;
    }

    .menu-button{
        width:39px;
        height:39px;
        flex-basis:39px;
    }

    .header .btn{
        padding:9px 11px;
        font-size:.82rem;
    }

    .products{
        padding:12px;
    }

    .form-box{
        padding:19px;
    }
}


</style>
</head>

<script>
/* =========================================
   COFFYCUP ADMIN - MANAGE PRODUCTS
========================================= */

const PRODUCTS_URL = "/api/products";
const ADMIN_PRODUCTS_URL = "/api/admin/products";
const LOGOUT_URL = "/api/admin/logout";

let products = [];
let editingId = null;
let noticeTimer = null;

const layout = document.getElementById("layout");
const modal = document.getElementById("modal");
const productForm = document.getElementById("productForm");
const productRows = document.getElementById("productRows");
const productCount = document.getElementById("productCount");
const errorMessage = document.getElementById("errorMessage");
const notice = document.getElementById("notice");
const saveButton = document.getElementById("saveButton");
const menuButton = document.getElementById("menuButton");
const overlay = document.getElementById("overlay");


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[character]));
}


/* =========================================
   NORMALIZE PRODUCT DATA
========================================= */

function normalizeProduct(product) {
    return {
        ...product,
        id: product.id ?? product.product_id,
        name: String(
            product.name ?? product.product_name ?? "Coffee Product"
        ),
        category: String(
            product.category ?? product.cat ?? "Coffee"
        ),
        price: Number(
            product.price ?? product.product_price ?? 0
        ),
        image: String(
            product.image ?? product.img ?? product.image_path ?? ""
        ),
        description: String(
            product.description ?? product.desc ?? product.product_description ?? ""
        )
    };
}

/* Normalize common local image paths so they work from admin URLs. */
function normalizeImagePath(value) {
    let path = String(value ?? "").trim();
    if (!path) return "";
    if (/^(https?:|data:|blob:)/i.test(path) || path.startsWith("/")) return path;
    path = path.replaceAll("\\\\", "/").replace(/^\.\//, "");
    if (path.startsWith("static/")) return "/" + path;
    if (path.startsWith("images/")) return "/" + path;
    if (path.startsWith("../images/")) return "/" + path.slice(3);
    return "/" + path;
}


/* =========================================
   COMMON API REQUEST
========================================= */

async function apiRequest(url, options = {}) {
    const headers = {
        ...(options.headers || {})
    };

    if (options.body) {
        headers["Content-Type"] = "application/json";
    }

    const response = await fetch(url, {
        ...options,
        credentials: "same-origin",
        headers
    });

    if (response.status === 401 || response.status === 403) {
        window.location.href = "/admin/";
        throw new Error("Admin session expired. Please log in again.");
    }

    const contentType = response.headers.get("content-type") || "";
    let data = {};

    if (contentType.includes("application/json")) {
        data = await response.json();
    } else {
        const responseText = await response.text();

        if (!response.ok) {
            throw new Error(responseText || "Request failed.");
        }
    }

    if (!response.ok || data.success === false) {
        throw new Error(
            data.message ||
            data.error ||
            "Something went wrong. Please try again."
        );
    }

    return data;
}


/* =========================================
   FORMAT PRICE
========================================= */

function formatPrice(price) {
    return "₹" + Number(price || 0).toLocaleString("en-IN", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
    });
}


/* =========================================
   DISPLAY PRODUCTS
========================================= */

function showProducts() {
    productCount.textContent =
        `${products.length} ${
            products.length === 1 ? "product" : "products"
        }`;

    if (products.length === 0) {
        productRows.innerHTML = `
            <tr>
                <td colspan="5" class="empty-message">
                    No products found. Click Add Product to add your first product.
                </td>
            </tr>
        `;
        return;
    }

    productRows.innerHTML = products.map(product => {
        const imagePath = normalizeImagePath(product.image);

        const imageHTML = imagePath
            ? `
                <img
                    class="product-image"
                    src="${escapeHTML(imagePath)}"
                    alt="${escapeHTML(product.name)}"
                    loading="lazy"
                    onerror="
                        this.hidden = true;
                        this.nextElementSibling.hidden = false;
                    "
                >
                <span
                    class="image-placeholder"
                    hidden
                    aria-hidden="true"
                >☕</span>
            `
            : `
                <span
                    class="image-placeholder"
                    aria-label="No product image"
                >☕</span>
            `;

        return `
            <tr>
                <td>${imageHTML}</td>

                <td>
                    <strong>${escapeHTML(product.name)}</strong>
                </td>

                <td>
                    <span class="category">
                        ${escapeHTML(product.category)}
                    </span>
                </td>

                <td>${formatPrice(product.price)}</td>

                <td>
                    <div class="actions">
                        <button
                            class="btn"
                            type="button"
                            data-action="edit"
                            data-id="${escapeHTML(product.id)}"
                        >Edit</button>

                        <button
                            class="btn delete"
                            type="button"
                            data-action="delete"
                            data-id="${escapeHTML(product.id)}"
                        >Delete</button>
                    </div>
                </td>
            </tr>
        `;
    }).join("");
}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts() {
    productRows.innerHTML = `
        <tr>
            <td colspan="5" class="status-message">
                Loading products from database...
            </td>
        </tr>
    `;

    try {
        const data = await apiRequest(PRODUCTS_URL, {
            method: "GET"
        });

        const list = Array.isArray(data)
            ? data
            : (data.products ?? data.data ?? []);

        if (!Array.isArray(list)) {
            throw new Error("Products API did not return a valid list.");
        }

        products = list.map(normalizeProduct);

        showProducts();

    } catch (error) {
        productCount.textContent = "Unable to load";

        productRows.innerHTML = `
            <tr>
                <td colspan="5" class="empty-message">
                    ${escapeHTML(error.message)}
                    <br><br>
                    Check Flask and GET ${escapeHTML(PRODUCTS_URL)}.
                </td>
            </tr>
        `;

        showNotice(error.message);
    }
}


/* =========================================
   OPEN ADD / EDIT FORM
========================================= */

function openForm(product = null) {
    productForm.reset();
    errorMessage.textContent = "";

    if (product) {
        editingId = product.id;

        document.getElementById("formTitle").textContent =
            "Edit Product";

        document.getElementById("productName").value =
            product.name;

        document.getElementById("productCategory").value =
            product.category;

        document.getElementById("productPrice").value =
            product.price;

        document.getElementById("productImage").value =
            product.image;
        document.getElementById("productDescription").value =
            product.description;

    } else {
        editingId = null;

        document.getElementById("formTitle").textContent =
            "Add Product";

        document.getElementById("productCategory").value =
            "Coffee";
    }

    saveButton.disabled = false;
    saveButton.textContent = "Save Product";

    modal.classList.add("show");
    document.getElementById("productName").focus();
}


/* =========================================
   CLOSE FORM
========================================= */

function closeForm() {
    modal.classList.remove("show");

    editingId = null;
    errorMessage.textContent = "";

    saveButton.disabled = false;
    saveButton.textContent = "Save Product";
}


/* =========================================
   ADD / UPDATE PRODUCT
========================================= */

productForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    errorMessage.textContent = "";

    const name = document
        .getElementById("productName")
        .value.trim();

    const category = document
        .getElementById("productCategory")
        .value;

    const priceInput = document
        .getElementById("productPrice")
        .value;

    const price = Number(priceInput);

    const image = document
        .getElementById("productImage")
        .value.trim();

    const description = document
        .getElementById("productDescription")
        .value.trim();

    if (!name) {
        errorMessage.textContent =
            "Please enter the product name.";
        return;
    }

    if (
        priceInput === "" ||
        !Number.isFinite(price) ||
        price <= 0
    ) {
        errorMessage.textContent =
            "Please enter a price greater than ₹0.";
        return;
    }

    const isEditing = editingId !== null;

    const url = isEditing
        ? `${ADMIN_PRODUCTS_URL}/${encodeURIComponent(editingId)}`
        : ADMIN_PRODUCTS_URL;

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    try {
        await apiRequest(url, {
            method: isEditing ? "PUT" : "POST",
            body: JSON.stringify({
                name,
                category,
                price,
                image,
                description
            })
        });

        closeForm();

        await loadProducts();

        showNotice(
            isEditing
                ? "Product updated successfully."
                : "Product added successfully."
        );

    } catch (error) {
        errorMessage.textContent = error.message;

        saveButton.disabled = false;
        saveButton.textContent = "Save Product";
    }
});


/* =========================================
   EDIT / DELETE PRODUCT
========================================= */

productRows.addEventListener("click", async function(event) {
    const button = event.target.closest("button[data-action]");

    if (!button) {
        return;
    }

    const product = products.find(
        item => String(item.id) === String(button.dataset.id)
    );

    if (!product) {
        showNotice("Product not found. Reloading products.");
        await loadProducts();
        return;
    }

    /* Edit product */

    if (button.dataset.action === "edit") {
        openForm(product);
        return;
    }

    /* Delete product */

    if (
        button.dataset.action === "delete" &&
        confirm(`Are you sure you want to delete "${product.name}"?`)
    ) {
        button.disabled = true;

        try {
            await apiRequest(
                `${ADMIN_PRODUCTS_URL}/${encodeURIComponent(product.id)}`,
                {
                    method: "DELETE"
                }
            );

            await loadProducts();

            showNotice("Product deleted successfully.");

        } catch (error) {
            button.disabled = false;
            showNotice(error.message);
        }
    }
});


/* =========================================
   ADD PRODUCT BUTTON
========================================= */

document.getElementById("addButton").addEventListener("click", function() {
    openForm();
});


/* =========================================
   CANCEL BUTTON
========================================= */

document.getElementById("cancelButton").addEventListener("click", function() {
    closeForm();
});


/* =========================================
   CLOSE MODAL OUTSIDE CLICK
========================================= */

modal.addEventListener("click", function(event) {
    if (event.target === modal) {
        closeForm();
    }
});


/* =========================================
   NOTIFICATION
========================================= */

function showNotice(message) {
    notice.textContent = message;
    notice.classList.add("show");

    clearTimeout(noticeTimer);

    noticeTimer = setTimeout(function() {
        notice.classList.remove("show");
    }, 3000);
}


/* =========================================
   SIDEBAR
========================================= */

function isMobile() {
    return window.matchMedia("(max-width:760px)").matches;
}

function closeMobileSidebar() {
    layout.classList.remove("mobile-open");

    menuButton.setAttribute("aria-expanded", "false");
}

menuButton.addEventListener("click", function() {
    if (isMobile()) {
        layout.classList.toggle("mobile-open");

        menuButton.setAttribute(
            "aria-expanded",
            String(layout.classList.contains("mobile-open"))
        );

    } else {
        layout.classList.toggle("collapsed");

        menuButton.setAttribute(
            "aria-expanded",
            String(!layout.classList.contains("collapsed"))
        );
    }
});

overlay.addEventListener("click", closeMobileSidebar);

document.querySelectorAll("nav a").forEach(function(link) {
    link.addEventListener("click", function() {
        if (isMobile()) {
            closeMobileSidebar();
        }
    });
});

window.addEventListener("resize", function() {
    if (!isMobile()) {
        closeMobileSidebar();
    }
});


/* =========================================
   ESCAPE KEY
========================================= */

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        if (modal.classList.contains("show")) {
            closeForm();
        }

        closeMobileSidebar();
    }
});


/* =========================================
   ADMIN LOGOUT
========================================= */

document.getElementById("logoutButton").addEventListener(
    "click",
    async function() {
        if (!confirm("Are you sure you want to logout?")) {
            return;
        }

        try {
            await apiRequest(LOGOUT_URL, {
                method: "POST",
                body: JSON.stringify({})
            });

        } catch (error) {
            console.warn("Logout API issue:", error.message);
        }

        window.location.href = "/admin/";
    }
);


/* =========================================
   INITIALIZE PAGE
========================================= */

loadProducts();

</script>
